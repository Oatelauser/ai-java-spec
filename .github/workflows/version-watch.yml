# 模板侧资产:每周自动查依赖新版,发现即开/追评 issue 提醒。
# push 到 main 只做冒烟(验证工作流健康),不打包不落 issue 防刷屏。
# 本文件在仓库根 .github/ 下,不随 resources/ 的拷贝传导——传导内容以 resources/ 为准。
name: 版本监控

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 9 * * 1' # 每周一 09:23 UTC,刻意避开整点(整点 cron 拥挤,触发易延迟)
  workflow_dispatch: {}

# 最小权限:只读仓库内容;issues:write 供 gh CLI 开 issue/评论
permissions:
  contents: read
  issues: write

# 同一时刻只跑一个监控实例;已跑的不取消(排队等上一轮结束即可)
concurrency:
  group: version-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 依赖版本对比(只读)
        id: check
        continue-on-error: true # 发现新版 exit 1 是预期信号,由下一步转成 issue,不让 job 直接红
        run: node resources/scripts/upgrade.js --check | tee "$RUNNER_TEMP/version-report.txt"
      - name: 打包离线升级包(仅有落后项)
        id: pack
        if: github.event_name != 'push' && steps.check.outcome == 'failure'
        run: node resources/scripts/upgrade.js --pack "$RUNNER_TEMP/dep-bundle"
      - name: 上传离线升级包(留 90 天)
        # pack 失败则不上传半个坏包(上传条件含 pack 成功);issue 文案对"无 Artifacts"情形有指引
        if: github.event_name != 'push' && steps.check.outcome == 'failure' && steps.pack.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: dep-bundle-${{ github.run_number }}
          path: ${{ runner.temp }}/dep-bundle
          retention-days: 90
      - name: 开 issue 提醒(仅当发现新版)
        if: github.event_name != 'push' && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          body="$(date -u +'## %Y-%m-%d %H:%M UTC')"$'\n\n'"$(cat "$RUNNER_TEMP/version-report.txt")"$'\n\n'"离线通道:本运行若已上传 Artifacts,到 https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID 页面底部下载 dep-bundle-$GITHUB_RUN_NUMBER(zip,含 manifest.json 与 sha256),解压后执行 node resources/scripts/upgrade.js --offline <解压目录> 零网络应用(ocr 本地 tgz 安装、jar 落位 .tools/);未上传(run 红,打包失败)则走在线通道:node resources/scripts/upgrade.js。"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '依赖版本更新提醒 in:title' --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title '依赖版本更新提醒' --body "$body"
          fi
